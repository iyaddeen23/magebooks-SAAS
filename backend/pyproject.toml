[project]
name = "magebooks-backend"
version = "0.1.0"
description = "Mage Books SAAS - Ghana Enterprise Accounting Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "uuid6>=2024.7",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.4",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
